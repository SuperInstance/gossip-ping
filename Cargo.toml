[package]
name = "gossip-ping"
version = "0.2.0"
description = "SWIM-style failure detection with direct ping, indirect ping-req fallback, and adaptive timeout"
license = "MIT OR Apache-2.0"
repository = "https://github.com/casey-digennaro/gossip-ping"
edition = "2021"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[dev-dependencies.gossip-ping]
path = "."
features = ["serde"]

[[example]]
name = "fleet_probe"
path = "examples/fleet_probe.rs"
